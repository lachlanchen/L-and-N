apply plugin: 'com.android.application'

def envOrProperty = { String name ->
    def value = System.getenv(name) ?: project.findProperty(name) ?: ""
    return value.toString().trim()
}
def releaseKeystorePath = envOrProperty("LANDN_ANDROID_KEYSTORE_FILE")
def releaseKeystorePassword = envOrProperty("LANDN_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = envOrProperty("LANDN_ANDROID_KEY_ALIAS")
def releaseKeyPassword = envOrProperty("LANDN_ANDROID_KEY_PASSWORD")
def releaseSigningReady = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { !it.isEmpty() }

android {
    namespace = "art.lazying.landn"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "art.lazying.landn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

tasks.register("verifyStoreReleaseConfiguration") {
    group = "verification"
    description = "Fails unless the Android upload key is configured outside the repository."
    doLast {
        def requiredNames = [
            "LANDN_ANDROID_KEYSTORE_FILE",
            "LANDN_ANDROID_KEYSTORE_PASSWORD",
            "LANDN_ANDROID_KEY_ALIAS",
            "LANDN_ANDROID_KEY_PASSWORD",
        ]
        def missingNames = requiredNames.findAll { envOrProperty(it).isEmpty() }
        if (!missingNames.isEmpty()) {
            throw new GradleException(
                "Store release configuration is incomplete: ${missingNames.join(', ')}"
            )
        }
        if (!file(releaseKeystorePath).isFile()) {
            throw new GradleException(
                "Android upload keystore does not exist: ${releaseKeystorePath}"
            )
        }
    }
}

tasks.matching { it.name in ["assembleRelease", "bundleRelease"] }.configureEach {
    dependsOn(tasks.named("verifyStoreReleaseConfiguration"))
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
