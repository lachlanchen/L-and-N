name: LAndNWatch
options:
  bundleIdPrefix: art.lazying.landn
  deploymentTarget:
    watchOS: "11.0"
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
targets:
  LAndNWatch:
    type: application
    platform: watchOS
    sources:
      - LAndNWatch
    resources:
      - LAndNWatch/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.lazying.landn.watch
        PRODUCT_NAME: L-and-N
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: L-and-N
        INFOPLIST_KEY_WKWatchOnly: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 4
schemes:
  LAndNWatch:
    build:
      targets:
        LAndNWatch: all
    run:
      config: Debug
    archive:
      config: Release
