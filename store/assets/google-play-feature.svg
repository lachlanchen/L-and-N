<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title desc">
  <title id="title">L and N pronunciation coach</title>
  <desc id="desc">A coral L and turquoise N connected by a waveform, with English, Mandarin, and Cantonese labels.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#e8f7f2"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff705e"/>
      <stop offset="1" stop-color="#16afa1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b2740" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1024" height="500" fill="url(#background)"/>
  <circle cx="83" cy="58" r="155" fill="#ff705e" opacity=".08"/>
  <circle cx="948" cy="452" r="210" fill="#16afa1" opacity=".09"/>
  <g filter="url(#shadow)">
    <rect x="70" y="62" width="884" height="376" rx="64" fill="#fffdf9"/>
  </g>
  <g font-family="Inter, ui-rounded, system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="512" y="156" fill="#15304b" font-size="42" font-weight="760" letter-spacing="-1">Hear it. Feel it. Say it.</text>
    <text x="384" y="306" fill="#ff705e" font-size="168" font-weight="850">L</text>
    <text x="640" y="306" fill="#16afa1" font-size="168" font-weight="850">N</text>
    <text x="512" y="388" fill="#61778b" font-size="25" font-weight="650" letter-spacing="3">ENGLISH · 普通话 · 廣東話</text>
  </g>
  <path d="M451 252h17l10-38 16 77 17-120 17 156 18-116 16 76 12-35h18" fill="none" stroke="url(#wave)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
